<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
<title>HONGJAE Logo</title>
<desc>HONGJAE independent consultant seal logo</desc>
<defs>
<filter id="deep-deboss" x="-30%" y="-30%" width="160%" height="160%">
<feGaussianBlur in="SourceAlpha" stdDeviation="0.6"/>
<feOffset dx="1.2" dy="1.5" result="sh"/>
<feFlood flood-color="#1a1815" flood-opacity="0.55"/>
<feComposite in2="sh" operator="in"/>
<feComposite in2="SourceGraphic" operator="over"/>
</filter>
<filter id="deep-emboss" x="-30%" y="-30%" width="160%" height="160%">
<feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
<feOffset dx="4" dy="5" result="se"/>
<feFlood flood-color="#1a1815" flood-opacity="0.5"/>
<feComposite in2="se" operator="in"/>
</filter>
</defs>
<g filter="url(#deep-deboss)">
<rect x="6" y="6" width="668" height="668" rx="4" fill="none" stroke="#1a1a1a" stroke-width="6"/>
<rect x="40" y="40" width="600" height="600" rx="2" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
</g>
<g transform="translate(345, 295)" filter="url(#deep-emboss)" opacity="0.6">
<line x1="-110" y1="-140" x2="-110" y2="140" stroke="#0a0a0a" stroke-width="22" stroke-linecap="square"/>
<line x1="110" y1="-140" x2="110" y2="140" stroke="#0a0a0a" stroke-width="22" stroke-linecap="square"/>
<circle cx="0" cy="0" r="22" fill="#0a0a0a"/>
</g>
<g transform="translate(340, 290)">
<line x1="-110" y1="-140" x2="-110" y2="140" stroke="#aea696" stroke-width="22" stroke-linecap="square"/>
<line x1="110" y1="-140" x2="110" y2="140" stroke="#aea696" stroke-width="22" stroke-linecap="square"/>
<circle cx="0" cy="0" r="22" fill="#aea696"/>
<line x1="-117" y1="-140" x2="-117" y2="140" stroke="#ffffff" stroke-width="2.5" stroke-linecap="square" opacity="0.9"/>
<line x1="103" y1="-140" x2="103" y2="140" stroke="#ffffff" stroke-width="2.5" stroke-linecap="square" opacity="0.9"/>
<circle cx="-5" cy="-5" r="22" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.75"/>
</g>
<g filter="url(#deep-deboss)">
<line x1="290" y1="510" x2="390" y2="510" stroke="#1a1a1a" stroke-width="2.5"/>
<text x="340" y="560" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="400" fill="#1a1a1a" letter-spacing="14">HONGJAE</text>
<text x="340" y="595" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="400" fill="#3a3a3a" letter-spacing="6" font-style="italic">independent consultant</text>
</g>
</svg>
